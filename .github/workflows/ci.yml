name: Tests and evaluation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Unit and API tests
        run: npm test
      - name: Quality evaluation (fails if below thresholds)
        run: npm run eval
